[project]
name = "coldfront-plugin-doi-resolver"
version = "0.1.0"
description = "ColdFront plugin resolving publications from DOIs and bibcodes via a fixed registry of registration agencies"
readme = "README.md"
authors = [
    { name = "York Schickl", email = "york.schickl@uni-konstanz.de" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "habanero>=1.2",
    "bibtexparser>=2.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]
# Integration tests boot a real ColdFront instance in-process. Keep the
# ColdFront pin in sync with the views the plugin's apps.py patches.
integration = [
    "coldfront>=1.1,<1.2",
    "pytest-django>=4.9",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = false

[tool.ruff]
# Keep in sync with requires-python.
target-version = "py312"
# Generated by Django; not worth hand-tuning. Exclude Markdown so the
# formatter does not rewrite Python snippets in the README.
extend-exclude = ["migrations", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# The formatter enforces line length where it can; long strings and
# docstrings are left alone rather than mangled to fit.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Settings for the ColdFront test instance used by tests/integration (with
# the "integration" dependency group). Without pytest-django installed the
# option is unknown; silence the resulting config warning for unit-only runs.
DJANGO_SETTINGS_MODULE = "tests.integration.settings"
filterwarnings = [
    "ignore::pytest.PytestConfigWarning",
]
